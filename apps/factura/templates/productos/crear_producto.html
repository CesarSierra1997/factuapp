{% extends 'index.html' %}
{% load static %}

{% block title %}Agregar producto{% endblock title %}

{% block index %}
<div class="container py-5">
    <h2 class="text-center mb-4">Agregar nuevo producto</h2>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_razonSocial" class="form-label">Nombre</label>
                        {{ form.nombre }}
                    </div>
                    <div class="mb-3">
                        <label for="id_nit" class="form-label">Valor</label>
                        {{ form.valor }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Agregar producto</button>
                    <a href="{% url 'factura:inicio_productos' negocio.id %}" class="btn btn-danger w-100 mt-1">Volver a productos</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
