{% extends 'index.html' %}
{% load static %}

{% block title %}Crear factura{% endblock title %}

{% block index %}

<div class="container py-5">
    <h3 class="text-center">Crear nueva factura</h3>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg p-4">
                <div class="flex d-flex justify-content-between align-items-center mb-4">
                <h5 class=" mb-2">{{ negocio.razonSocial }}</h4>
                <img src="{{ negocio.logo }}" alt="Logo del negocio" class="img-thumbnail me-3" width="50">
                </div>
                <hr>
                <h5 class="card-header my-1">Datos de la factura</h5>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.as_p}}
                    </div>
                    <button type="submit" class="btn btn-success w-100">Crear factura</button>
                    <a href="{% url 'factura:detalle_negocio' negocio.id %}" class="btn btn-secondary w-100 mt-1">Volver al negocio</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
